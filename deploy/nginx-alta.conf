# nginx — vhost temporal, solo para el alta del certificado.
#
# Hace falta porque `default-block.conf` devuelve 444 a cualquier host desconocido
# en el puerto 80: sin este fichero, la petición de validación de certbot para
# cuquita.juanko.com se corta antes de llegar a ningún sitio y el certificado no
# se emite nunca.
#
# Se instala, se pide el certificado y se sustituye por deploy/nginx.conf.
# No se queda: no sirve el sitio, solo abre la puerta a certbot.

server {
    listen 80;
    listen [::]:80;
    server_name cuquita.juanko.com;

    root /var/www/cuquita;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
