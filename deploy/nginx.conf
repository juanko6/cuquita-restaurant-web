# nginx — Cuquita Restaurant en cuquita.juanko.com (sitio de pruebas)
#
# Convive con el portafolio en la misma instancia. Build estático de Astro en
# /var/www/cuquita, publicado con deploy/publish.sh. Alta y rollback: deploy/oracle.md.
#
# ⚠ NO añadir `http2` al `listen 443` de este fichero. En nginx 1.18 esa opción es
# del socket :443, no del bloque server: ya la declara el vhost de juanko.com y
# repetirla aquí da "duplicate listen options" y tumba la configuración entera,
# portafolio incluido. El sitio va por HTTP/2 igualmente.

# ---------------------------------------------------------------------------
# HTTP → HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name cuquita.juanko.com;

    return 301 https://cuquita.juanko.com$request_uri;
}

# ---------------------------------------------------------------------------
# El sitio
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cuquita.juanko.com;

    ssl_certificate /etc/letsencrypt/live/cuquita.juanko.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cuquita.juanko.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/cuquita;
    index index.html;

    access_log /var/log/nginx/cuquita.access.log;
    error_log /var/log/nginx/cuquita.error.log;

    # Compresión. NO es opcional: el presupuesto de peso del proyecto se mide
    # comprimido, y la carta pasa de 12 KB a 90 KB sin esto. El nginx.conf global
    # trae `gzip on` pero con `gzip_types` comentado, así que sin este bloque solo
    # se comprimiría text/html.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/ld+json
        image/svg+xml;

    # Esto es una copia de pruebas de un negocio real que ya existe en Google con
    # otro dominio. Si se indexa, compite consigo mismo. Se quita el día que el
    # sitio se mude a cuquitarestaurant.co.
    add_header X-Robots-Tag "noindex, nofollow" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # OJO: en nginx, un `location` con su propio `add_header` DESCARTA los
    # heredados. Por eso se repiten abajo. Si se añade una cabecera aquí, hay que
    # replicarla también allí.

    # Astro pone un hash en el nombre de todo lo que mete en /_astro/, imágenes
    # optimizadas incluidas, así que se puede cachear un año sin miedo.
    location ^~ /_astro/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Lo de public/ no lleva hash: caché moderada.
    location ~* \.(?:jpg|jpeg|png|webp|avif|gif|svg|ico|woff2?)$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Las 301 del sitio antiguo. Aquí no hacen falta —nadie llega a este dominio
    # desde Google— pero se prueban en pruebas para que el día de la mudanza ya
    # estén escritas y comprobadas.
    location = /menus/breakfast-colombian-snacks/ { return 301 /carta#c-desayunos; }
    location = /menus/starters/                   { return 301 /carta; }
    location = /menus/main-entrees/               { return 301 /carta; }
    location = /menus/kidsmenu/                   { return 301 /carta; }
    location = /menus/beverages/                  { return 301 /carta; }
    location = /contact-us/                       { return 301 /visitanos; }
    location ^~ /menus/                           { return 301 /carta; }

    # La 404 de Astro, con su estado real. Ponerla como último `try_files` la
    # devolvería con un 200.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
